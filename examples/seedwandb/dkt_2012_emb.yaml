# ARCHIVE FILE

program: wandb_dkt_train.py
method: grid
metric:
  goal: maximize
  name: validauc
name: sweep_xes_dkt_regularized
parameters:
  model_name:
    values: ["dkt"]
  dataset_name:
    values: ["xes"]          # or assist2009 if you swap it
  emb_type:
    values: ["qid"]
  save_dir:
    values: ["models/dkt_tiaocan"]

  proj_dim:
    values: [512]

  l2:
    values: [0.0, 0.0001]

  learning_rate:
    values: [0.0003, 0.0007]

  dropout:
    values: [0.5]
  seed:
    values: [42]
  fold:
    values: [0]
