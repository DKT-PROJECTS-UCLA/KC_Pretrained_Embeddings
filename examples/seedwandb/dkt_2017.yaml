# ARCHIVE FILE
program: wandb_dkt_train.py
method: bayes
metric:
  goal: maximize
  name: validauc
name: sweep_assist2017_dkt_idea3

parameters:
  model_name:
    values: ["dkt"]
  dataset_name:
    values: ["assist2017"]
  emb_type:
    values: ["qid"]
  save_dir:
    values: ["models/dkt_idea3_2017"]

  emb_size:
    values: [3072]

  # ---- Key: small bottlenecks (2017 likes tight compression) ----
  proj_dim:
    values: [16, 24, 32, 48]

  # ---- Moderate LSTM capacities ----
  hidden_size:
    values: [48, 64, 96]

  # ---- Strong regularization (2017 consistently prefers this) ----
  dropout:
    values: [0.5, 0.6, 0.65]

  l2:
    values: [0.0, 0.0001]

  # ---- Safe, proven LR range for 2017 ----
  learning_rate:
    values: [1e-4, 3e-4]

  seed:
    values: [42]
  fold:
    values: [0]