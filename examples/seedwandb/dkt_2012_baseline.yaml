# ARCHIVE FILE

program: wandb_dkt_train.py
method: bayes
metric:
  goal: maximize
  name: validauc
name: sweep_xes_dkt_regularized
parameters:
  model_name:
    values: ["dkt"]
  dataset_name:
    values: ["xes"]          # or assist2009 if you swap it
  emb_type:
    values: ["qid"]
  save_dir:
    values: ["models/dkt_tiaocan"]

  # LOWER, SAFER LRs
  learning_rate:
    values: [5e-4, 3e-4, 1e-4]

  # KEEP DROPOUT HIGH-MODERATE
  dropout:
    values: [0.35, 0.5, 0.65]

  proj_dim:
    values: [64, 128, 256, 512, 1024]

  # MUCH STRONGER WEIGHT DECAY
  l2:
    values: [1e-4, 5e-4, 1e-3]

  seed:
    values: [42]
  fold:
    values: [0]
