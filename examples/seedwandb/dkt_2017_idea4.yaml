program: wandb_dkt_train.py
method: bayes
metric:
  goal: maximize
  name: validauc
name: sweep_assist2017_dkt_idea3_refined

parameters:
  model_name:
    values: ["dkt"]
  dataset_name:
    values: ["xes"]
  emb_type:
    values: ["qid"]
  save_dir:
    values: ["models/dkt_idea3_refined"]

  emb_size:
    values: [3072]
  pretrained_emb_path:
    value: ../pretrained_Embedding/final_embeddings_assist2012_text_embedding_3_large/pipeline_1_final_dkt.pt

  # -------- Representation bottleneck (wider search) --------
  # ---- no bottleneck ----
  proj_dim:
    values: [224, 240, 256]

  hidden_size:
    values: [128, 144]

  num_layers:
    values: [1, 2]

  use_semantic_output:
    values: [true]

  # regularization: now important because you’re unfreezing
  dropout:
    values: [0.30, 0.35, 0.40]

  l2:
    values: [0.0, 1e-5, 3e-5, 1e-4]

  # more cautious LR band around your current 5e-4
  learning_rate:
    values: [1e-4, 2e-4, 3e-4, 5e-4]




  seed:
    values: [42]
  fold:
    values: [0]